# Node sale de .nvmrc y pnpm del campo packageManager de package.json.
[build]
  command = "pnpm build"
  publish = "dist"

# Los previews y branch deploys no se indexan; solo producción.
[context.deploy-preview.environment]
  SITE_NOINDEX = "1"
[context.branch-deploy.environment]
  SITE_NOINDEX = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

# Archivos con hash en el nombre: no cambian nunca.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los logos conservan el nombre al rehacerse: un día de caché y revalidación en segundo plano.
# Las capturas salen de src/assets y Astro les pone hash (/_astro/*).
[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Enlaces que cambiaron de id: la ruta vieja lleva a la nueva.
[[redirects]]
  from = "/tool/stitch-withgoogle-com"
  to = "/tool/stitch-google-com"
  status = 301
[[redirects]]
  from = "/en/tool/stitch-withgoogle-com"
  to = "/en/tool/stitch-google-com"
  status = 301

# Una ruta que no existe bajo /en muestra la 404 en inglés; el resto usa /404.html.
# Netlify solo aplica la regla si no hay un archivo en esa ruta.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
